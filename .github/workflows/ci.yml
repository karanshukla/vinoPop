name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# The lint job and the test matrix use the dev group only, so they cover the
# GTK-free modules and plugins on every Python. test-gtk runs the whole suite
# on the runner's own python3 with the distro's PyGObject/GTK, the setup the
# app supports (pyproject.toml).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv
      - run: uv pip install --group dev
      - run: scripts/lint.sh

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --group dev
      # No coverage here: without GTK about 50 tests skip, so the figure is
      # lower and means less. test-gtk measures it.
      - run: .venv/bin/python -m pytest

  test-gtk:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # librsvg2-common: install.sh refuses to run without GTK's SVG loader,
      # which --no-install-recommends leaves out (test_install_sh.py)
      - name: GTK 4, libadwaita, pycairo, dbus-python, python-xlib, AT-SPI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-dbus python3-xlib xvfb \
            at-spi2-core gir1.2-atspi-2.0 python3-pyatspi dbus-daemon \
            librsvg2-common
      # The distro's python3, or the venv can't see its PyGObject
      - run: uv venv --python /usr/bin/python3 --system-site-packages
      # PySide6-Essentials has QtWidgets, all tray/tray_qt.py imports, so the
      # real tray child runs offscreen in tests/test_tray.py
      - run: uv pip install --group dev PySide6-Essentials
      # GTK needs a display to import its widgets. The session bus carries
      # the accessibility bus, so tests/test_a11y.py can read the AT-SPI tree.
      # Coverage is measured here, the only job that runs the whole suite
      # ([tool.coverage.run] in pyproject.toml). The floor sits a few points
      # under what this job measured; raise it as tests land.
      - name: pytest with coverage
        run: >-
          xvfb-run -a dbus-run-session -- .venv/bin/python -m pytest -rs
          --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=53
        env:
          VINOPOP_ATSPI_TEST: "1"
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        run: |
          total=$(.venv/bin/python -m coverage report --format=total)
          .venv/bin/python -m coverage report --format=markdown --sort=cover --skip-covered > coverage.md
          {
            echo "## Coverage (line + branch): ${total}%"
            echo
            echo "<details><summary>Per file, least covered first</summary>"
            echo
            cat coverage.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  uv-run:
    # What CONTRIBUTING.md tells contributors to run, from a fresh checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run poe check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh .githooks/*

  commits:
    # git-cliff builds CHANGELOG.md from commit subjects (cliff.toml)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git log --no-merges --format=%s "origin/${BASE_REF}..HEAD" | scripts/check_commits.sh
