name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# The dev group only: no job here has GTK or OpenVINO, so the tests cover
# the GTK-free modules and plugins (CONTRIBUTING.md).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv
      - run: uv pip install --group dev
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --group dev
      - run: .venv/bin/python -m pytest --cov=. --cov-report=term-missing

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck install.sh packaging/deb/build-deb.sh packaging/flatpak/publish-flatpak-repo.sh packaging/gen-version.sh
