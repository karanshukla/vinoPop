name: Release

# Runs on a pushed v* tag. vinoPop installs from a checkout (install.sh), so
# a release is the tag plus its notes: nothing is built or uploaded.

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the previous tag, for the compare link
          persist-credentials: false

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # CHANGELOG.md is hand-edited, so it is the source of release prose.
          # The script rejoins its wrapped lines, which GitHub would break.
          python3 scripts/release_notes.py "$version" > RELEASE_NOTES.md
          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo "git clone --branch v${version} https://github.com/${GITHUB_REPOSITORY}.git ~/vinopop"
            echo 'cd ~/vinopop && bash install.sh'
            echo '```'
            echo
            echo "The [README](https://github.com/${GITHUB_REPOSITORY}#install) has the system packages and the optional AI setup."
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "vinoPop ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
